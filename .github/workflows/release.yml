name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Pre-create GitHub release
        run: |
          if (-not (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "ayuvitaCRM $env:GITHUB_REF_NAME" --notes "" --draft=false
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create bundled .env for packaged app
        shell: pwsh
        run: |
          $kv = [ordered]@{
            'SHOPIFY_DOMAIN'             = '${{ secrets.SHOPIFY_DOMAIN }}'
            'SHOPIFY_ADMIN_ACCESS_TOKEN' = '${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}'
            'SHOPIFY_CLIENT_ID'          = '${{ secrets.SHOPIFY_CLIENT_ID }}'
            'SHOPIFY_CLIENT_SECRET'      = '${{ secrets.SHOPIFY_CLIENT_SECRET }}'
            'SUPABASE_RLS_SECRET'        = '${{ secrets.SUPABASE_RLS_SECRET }}'
          }
          ($kv.GetEnumerator() | Where-Object { $_.Value } | ForEach-Object { "$($_.Key)=$($_.Value)" }) | Set-Content -Path .env -Encoding utf8
          Write-Host "Bundled .env with $($kv.Count) keys"

      - name: Package and publish to GitHub Releases
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release assets are complete
        run: |
          gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --clobber "dist_electron/*.exe" "dist_electron/*.exe.blockmap" "dist_electron/latest.yml" "dist_electron/*.exe.sig" 2>$null
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
